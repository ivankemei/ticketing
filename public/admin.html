<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXTPLAY Admin</title>
<meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login">
  <div class="eyebrow">Organisers only</div>
  <h1>Admin</h1>
  <label>Admin PIN</label>
  <div id="pinbox" aria-live="polite" style="min-height:62px;display:flex;align-items:center;border:2px solid #c6ff3d;border-radius:10px;padding:10px 14px;font-size:28px;font-weight:800;letter-spacing:.22em;background:#0b0d12;color:#ffffff;word-break:break-all"></div>
  <div class="hint" style="margin-top:6px">Tap the numbers, or use your keyboard.</div>
  <div id="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px"></div>
  <div class="err" id="lerr"></div>
  <button class="btn block" id="go">Sign in</button>
</div>

<div id="app" hidden>
  <div class="topbar"><b>Admin</b><span><a class="btn ghost small" href="/scanner">Open scanner</a> <button class="btn ghost small" id="csv">Export CSV</button> <button class="btn ghost small" id="out">Log out</button></span></div>
  <div class="tabs"><button class="tab on" data-t="ov">Overview</button><button class="tab" data-t="ord">Registrations</button><button class="tab" data-t="tk">Tickets</button></div>
  <div class="adm">
    <section id="ov"></section>
    <section id="ord" hidden>
      <div class="filters"><input id="oq" placeholder="Search name, phone, email, receipt, team…"><select id="oev"></select>
        <select id="ost"><option value="">All statuses</option><option>paid</option><option>pending</option><option>failed</option><option>cancelled</option><option>review</option></select></div>
      <div class="tablewrap"><table><thead><tr><th>Ref</th><th>Category</th><th>Name</th><th>Team</th><th>Phone</th><th>Email</th><th>KES</th><th>Status</th><th>Receipt</th><th>Email sent</th><th>Time</th><th></th></tr></thead><tbody id="otb"></tbody></table></div>
    </section>
    <section id="tk" hidden>
      <div class="filters"><input id="tq" placeholder="Search serial, holder, phone, team…"><select id="tev"></select>
        <select id="tst"><option value="">All statuses</option><option>valid</option><option>used</option><option>void</option></select></div>
      <div class="tablewrap"><table><thead><tr><th>Serial</th><th>Category</th><th>Holder</th><th>Team</th><th>Phone</th><th>Status</th><th>Scanned at</th><th>Order</th></tr></thead><tbody id="ttb"></tbody></table></div>
    </section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (t) => t ? new Date(t).toLocaleString('en-KE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const kes = (n) => Number(n).toLocaleString('en-KE');
let token = sessionStorage.getItem('admin');
const api = async (url, opt = {}) => {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', 'x-staff-token': token, ...(opt.headers || {}) } });
  if (r.status === 401) { sessionStorage.removeItem('admin'); location.reload(); throw new Error('auth'); }
  return r;
};

async function login() {
  $('#lerr').textContent = 'Checking…';
  try {
    if (!pinVal) { $('#lerr').textContent = 'Enter your PIN first.'; return; }
    const r = await fetch('/api/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pinVal }) });
    let j = {};
    try { j = await r.json(); } catch (e) { $('#lerr').textContent = 'Server problem (code ' + r.status + '). Open /api/health to check.'; return; }
    if (!r.ok || j.role !== 'admin') { $('#lerr').textContent = r.ok ? 'That PIN is not an admin PIN' : (j.error || 'Server problem (code ' + r.status + ')'); return; }
    token = j.token; sessionStorage.setItem('admin', token); $('#lerr').textContent = ''; start();
  } catch (e) { $('#lerr').textContent = 'Could not reach the server. Check your internet and try again.'; }
}
// PIN entry: on-screen keypad + physical keyboard, independent of any text box focus
let pinVal = '';
function showPin() {
  $('#pinbox').innerHTML = pinVal ? esc(pinVal) : '<span style="color:#6b7280;font-size:18px;letter-spacing:0;font-weight:500">Enter PIN</span>';
}
function pinKey(k) {
  if (k === 'back') pinVal = pinVal.slice(0, -1);
  else if (k === 'clear') pinVal = '';
  else if (pinVal.length < 32) pinVal += k;
  $('#lerr').textContent = ''; showPin();
}
[...'123456789', 'clear', '0', 'back'].forEach((k) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn ghost'; b.style.cssText = 'font-size:22px;padding:14px 0';
  b.textContent = k === 'back' ? '⌫' : k === 'clear' ? 'C' : k;
  b.onclick = () => pinKey(k);
  $('#pad').appendChild(b);
});
document.addEventListener('keydown', (e) => {
  if ($('#login').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); login(); }
  else if (e.key === 'Backspace') { e.preventDefault(); pinKey('back'); }
  else if (e.key === 'Escape') pinKey('clear');
  else if (e.key.length === 1) { e.preventDefault(); pinKey(e.key); }
});
showPin();
$('#go').onclick = login;
$('#out').onclick = () => { sessionStorage.removeItem('admin'); location.reload(); };
$('#csv').onclick = async () => {
  const b = await (await api('/api/admin/export.csv')).blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'tickets.csv'; a.click();
};
document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  ['ov', 'ord', 'tk'].forEach((id) => ($('#' + id).hidden = id !== t.dataset.t)); refresh();
}));

async function overview() {
  const j = await (await api('/api/admin/summary')).json();
  $('#ov').innerHTML = `<div class="tiles">
    <div class="tile"><small>Revenue</small><b>KES ${kes(j.totals.revenue)}</b></div>
    <div class="tile"><small>Tickets issued</small><b>${j.totals.tickets}</b></div>
    <div class="tile"><small>Checked in</small><b>${j.totals.checked_in}</b></div></div>
    <div class="tablewrap"><table><thead><tr><th>Category</th><th>Capacity</th><th>Price (KES)</th><th>Sold</th><th>Held</th><th>Remaining</th><th>Tickets</th><th>Checked in</th><th>Revenue</th><th></th></tr></thead><tbody>
    ${j.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td>
      <td><input data-cap="${r.code}" value="${r.capacity ?? ''}" placeholder="∞" inputmode="numeric"></td>
      <td><input data-price="${r.code}" value="${r.price}" inputmode="numeric"></td>
      <td>${r.sold}</td><td>${r.held}</td><td><b>${r.capacity == null ? '∞' : Math.max(0, r.capacity - r.sold - r.held)}</b></td>
      <td>${r.tickets}</td><td>${r.checked_in}</td><td>${kes(r.revenue)}</td>
      <td><button class="btn small" data-save="${r.code}">Save</button></td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Capacity counts players, teams (COD) or spectator seats. Held = slots reserved by payments in progress (released after 4 minutes). Lowering capacity never cancels existing tickets.</p>`;
  document.querySelectorAll('[data-save]').forEach((b) => (b.onclick = async () => {
    const c = b.dataset.save, cap = $(`[data-cap="${c}"]`).value.trim(), price = $(`[data-price="${c}"]`).value.trim();
    const r = await api('/api/admin/events/' + c, { method: 'PATCH', body: JSON.stringify({ capacity: cap === '' ? null : Number(cap), price: Number(price) }) });
    b.textContent = r.ok ? 'Saved ✓' : 'Error'; setTimeout(overview, 800);
  }));
  const opts = '<option value="">All categories</option>' + j.rows.map((r) => `<option value="${r.code}">${esc(r.name)}</option>`).join('');
  [$('#oev'), $('#tev')].forEach((s) => { if (!s.options.length) s.innerHTML = opts; });
}

async function orders() {
  const p = new URLSearchParams({ q: $('#oq').value, event: $('#oev').value, status: $('#ost').value });
  const rows = await (await api('/api/admin/orders?' + p)).json();
  $('#otb').innerHTML = rows.map((o) => `<tr><td><code>${o.public_id}</code></td><td>${esc(o.event_name)}</td><td>${esc(o.name)}</td><td>${esc(o.team_name || '')}</td><td>${o.phone}</td><td>${esc(o.email)}</td>
    <td>${kes(o.amount)}</td><td><span class="pill ${o.status}">${o.status}</span></td><td>${esc(o.mpesa_receipt || '')}</td>
    <td>${o.status === 'paid' ? (o.emailed_at ? '✓ ' + fmt(o.emailed_at) : `<span style="color:var(--bad)">not sent</span>`) : ''}</td><td>${fmt(o.created_at)}</td>
    <td>${o.status === 'paid' ? `<button class="btn ghost small" data-resend="${o.id}">Resend email</button>`
      : o.status !== 'paid' ? `<button class="btn ghost small" data-confirm="${o.id}">Confirm manually</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="12" class="hint">Nothing yet.</td></tr>';
  document.querySelectorAll('[data-resend]').forEach((b) => (b.onclick = async () => { b.disabled = true; const r = await (await api(`/api/admin/orders/${b.dataset.resend}/resend`, { method: 'POST' })).json(); b.textContent = r.ok ? 'Sent ✓' : 'Failed'; }));
  document.querySelectorAll('[data-confirm]').forEach((b) => (b.onclick = async () => {
    const receipt = prompt('Only use this if the customer really paid. Enter the M-Pesa receipt code (e.g. SHK1ABC2DE):');
    if (!receipt) return;
    const r = await api(`/api/admin/orders/${b.dataset.confirm}/confirm`, { method: 'POST', body: JSON.stringify({ receipt }) });
    const j = await r.json(); if (!r.ok) alert(j.error); orders();
  }));
}

async function tickets() {
  const p = new URLSearchParams({ q: $('#tq').value, event: $('#tev').value, status: $('#tst').value });
  const rows = await (await api('/api/admin/tickets?' + p)).json();
  $('#ttb').innerHTML = rows.map((t) => `<tr><td><code>${t.serial}</code></td><td>${esc(t.event_name)}</td><td>${esc(t.holder_name)}</td><td>${esc(t.team_name || '')}</td><td>${t.phone}</td>
    <td><span class="pill ${t.status}">${t.status}</span></td><td>${fmt(t.used_at)}</td><td><code>${t.order_ref}</code></td></tr>`).join('') || '<tr><td colspan="8" class="hint">Nothing yet.</td></tr>';
}

const refresh = () => (!$('#ov').hidden ? overview() : !$('#ord').hidden ? orders() : tickets());
let timer;
const debounce = (f) => () => { clearTimeout(timer); timer = setTimeout(f, 250); };
['#oq', '#oev', '#ost'].forEach((s) => ($(s).oninput = debounce(orders)));
['#tq', '#tev', '#tst'].forEach((s) => ($(s).oninput = debounce(tickets)));
function start() { $('#login').hidden = true; $('#app').hidden = false; overview(); setInterval(() => { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') refresh(); }, 10000); }
if (token) start();
</script>
</body>
</html>
