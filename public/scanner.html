<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXTPLAY Gate Scanner</title>
<meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login">
  <div class="eyebrow">Staff only</div>
  <h1>Gate scanner</h1>
  <label>Staff PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
  <div class="err" id="lerr"></div>
  <button class="btn block" id="go">Open scanner</button>
</div>

<div id="app" hidden>
  <div class="topbar"><b>Gate scanner</b><span class="stats" id="stats"></span><button class="btn ghost small" id="out">Log out</button></div>
  <div id="scanBox">
    <div id="reader"></div>
    <div id="camErr" class="err"></div>
    <div id="result"><div class="sub">Point the camera at a ticket QR code</div></div>
    <form class="manual" id="manual">
      <input id="serial" placeholder="Or type serial, e.g. KON-7QK2-M9XD" autocomplete="off" autocapitalize="characters">
      <button class="btn">Check</button>
    </form>
  </div>
</div>

<script src="/vendor/html5-qrcode.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = sessionStorage.getItem('staff'), scanner = null, busy = false, lastCode = '', lastAt = 0;

async function login() {
  $('#lerr').textContent = '';
  const r = await fetch('/api/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('#pin').value }) });
  const j = await r.json();
  if (!r.ok) { $('#lerr').textContent = j.error; return; }
  token = j.token; sessionStorage.setItem('staff', token); start();
}
$('#go').onclick = login;
$('#pin').onkeydown = (e) => e.key === 'Enter' && login();
$('#out').onclick = () => { sessionStorage.removeItem('staff'); location.reload(); };

function beep(ok) {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = ok ? 880 : 220; o.type = ok ? 'sine' : 'square'; g.gain.value = 0.15;
    o.start(); o.stop(c.currentTime + (ok ? 0.15 : 0.45));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 80, 200]);
}

async function check(code) {
  if (busy) return; busy = true;
  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-staff-token': token }, body: JSON.stringify({ code }) });
    if (r.status === 401) { sessionStorage.removeItem('staff'); location.reload(); return; }
    show(await r.json());
  } catch (e) { show({ result: 'INVALID', message: 'No connection to server. Try again.' }); }
  setTimeout(() => (busy = false), 1200); // brief pause so one ticket isn't scanned twice by accident
  stats();
}

function show(j) {
  const ok = j.result === 'VALID';
  const el = $('#result'); el.className = j.result;
  const title = { VALID: '✔ ALLOW ENTRY', ALREADY_USED: '✖ ALREADY USED', INVALID: '✖ INVALID', VOID: '✖ CANCELLED' }[j.result] || j.result;
  const when = j.usedAt ? `First scanned ${new Date(j.usedAt).toLocaleString('en-KE', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })}` : '';
  el.innerHTML = `<div class="verdict">${title}</div>` + (j.holder ? `<div class="holder">${esc(j.holder)}</div>
    <div class="sub">${esc(j.category)}${j.team ? ' · Team ' + esc(j.team) : ''}</div><div class="sub"><code>${esc(j.serial)}</code></div>` : `<div class="sub">${esc(j.message)}</div>`)
    + (when ? `<div class="sub">${when}</div>` : '');
  beep(ok);
}

async function stats() {
  try {
    const j = await (await fetch('/api/scan/stats', { headers: { 'x-staff-token': token } })).json();
    $('#stats').innerHTML = `Inside <strong>${j.total.in_venue}</strong> / ${j.total.issued}`;
  } catch (e) {}
}

$('#manual').onsubmit = (e) => { e.preventDefault(); const v = $('#serial').value.trim(); if (v) { check(v); $('#serial').value = ''; } };

function start() {
  $('#login').hidden = true; $('#app').hidden = false; stats(); setInterval(stats, 15000);
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } },
    (text) => { const now = Date.now(); if (text === lastCode && now - lastAt < 4000) return; lastCode = text; lastAt = now; check(text); },
    () => {}
  ).catch((err) => { $('#camErr').textContent = 'Camera unavailable (' + (err?.message || err) + '). Camera access needs HTTPS and your permission. You can still type serials below.'; });
}
if (token) start();
</script>
</body>
</html>
